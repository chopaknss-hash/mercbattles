 const top=(ti,f,fmt)=>`<div class="card"><h4 style="color:var(--gold);margin-bottom:6px">${ti}</h4>${[...rows].sort((a,b)=>f(b)-f(a)).slice(0,5).map((r,i)=>`<div class="li" style="cursor:default;padding:6px 4px"><span class="pn" style="width:26px;height:26px">${i+1}</span><span>${avi(r.e,22)}${nm(r.e)}</span><b class="num r">${fmt?fmt(r):f(r)}</b></div>`).join('')}</div>`;
 const th=(k,l)=>`<th class="sb ${K==k?'on':''}" onclick="V.sk='${k}';render()">${l}${K==k?' ▼':''}</th>`;
 let h=`<div class="row"><select class="fs" onchange="V.cf=this.value;render()"><option value="">Все соревнования</option>${t.comps.map(c=>`<option value="${c.id}" ${cf==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>${t.club?`<span class="ch ${!tm?'on':''}" onclick="V.sm='pl';render()">Игроки</span><span class="ch ${tm?'on':''}" onclick="V.sm='tm';render()">Команды</span>`:''}</div>`;
 if(cs)h+=`<div class="row" style="margin-top:0"><span class="ch ${!mp?'on':''}" onclick="V.mp='';render()">Все карты</span>${allMaps(t).map(n=>`<span class="ch ${mp==n?'on':''}" data-m="${esc(n)}" onclick="V.mp=this.dataset.m;render()">${esc(n)}</span>`).join('')}</div>${mp?'<p class="mu">Килы, смерти и ассисты по карте берутся из статистики «за карту» либо из матча, где сыграна только эта карта.</p>':''}`;
 if(!rows.length)return h+'<p class="mu">Пока нет сыгранных матчей для статистики.</p>';
 h+=`<div class="grid">${top('Килы',r=>r.k)}${top('Смерти',r=>r.de)}${top('K/D',r=>+kd(r),kd)}${top('Выигранные раунды',r=>r.rw)}</div><h2>Общая таблица</h2><p class="mu">Нажми на заголовок столбца, чтобы отсортировать.</p>`;
 return h+`<div class="card sc"><table><tr><th>#</th><th></th>${th('n',tm?'Команда':'Игрок')}${th('m',mp?'Карт':'Матчи')}${th('w','В')}${th('d','Н')}${th('l','П')}${th('k','K')}${th('de','D')}${th('kd','K/D')}${th('a','A')}${th('rw','Выигр. р.')}<th>Проигр. р.</th>${th('df','+/−')}${cs&&!mp?'<th>Лучшая карта</th>':''}</tr>${sorted.map((r,i)=>`<tr><td><span class="pn">${i+1}</span></td><td>${avi(r.e,30)}</td><td><a class="lk" onclick="prof('${r.e.id}')">${nm(r.e)}</a></td><td>${r.m}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.k}</td><td>${r.de}</td><td>${kd(r)}</td><td>${r.a}</td><td>${r.rw}</td><td>${r.rl}</td><td>${r.rw-r.rl}</td>${cs&&!mp?`<td>${esc(r.best)}</td>`:''}</tr>`).join('')}</table></div>`}
function render(){
 $('#au').innerHTML=`<span class="tag">${sb?'☁ общая база':'💾 только это устройство'}</span>`+(S?`<button class="bt g" onclick="go('acc',S)">${esc(dn(S))}</button>`:`<button class="bt g" onclick="authM(0)">Войти</button><button class="bt" onclick="authM(1)">Регистрация</button>`);
 $('#app').innerHTML=!ready?'<p class="mu">Загрузка…</p>':V.p=='t'?tp():V.p=='acc'?accp():home()}
</script>
